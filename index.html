<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #000;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    gap: 40px;
    font-family: -apple-system, sans-serif;
  }
  button {
    width: 280px;
    height: 120px;
    border-radius: 20px;
    border: none;
    font-size: 36px;
    font-weight: bold;
    color: white;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  #prev { background: #333; }
  #next { background: #C9A84C; }
  #status {
    color: #666;
    font-size: 14px;
  }
</style>
</head>
<body>
<div id="status">En attente...</div>
<button id="prev" onclick="sendCommand('prev')">← Précédent</button>
<button id="next" onclick="sendCommand('next')">Suivant →</button>
<script>
  var PLAYER_IP = '172.21.1.68';
  var PORT = '1234';

  function sendCommand(cmd) {
    var xhr = new XMLHttpRequest();
    xhr.open('GET', 'http://' + PLAYER_IP + ':' + PORT + '/update?slideCommand=' + cmd, true);
    xhr.onload = function() {
      document.getElementById('status').textContent = cmd === 'next' ? '→ Suivant envoyé' : '← Précédent envoyé';
    };
    xhr.onerror = function() {
      document.getElementById('status').textContent = 'Erreur de connexion';
    };
    xhr.send();
  }
</script>
</body>
</html>
